<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/bootstrap.min.css">

    <title>Posted Review</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #10c4c9;
            padding: 18px 25px;
        }

        .navbar a {
            color: black;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        .container-box {
            max-width: 850px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .review-box {
            border-top: 1px solid #ddd;
            margin-top: 20px;
            padding-top: 20px;
        }

        .review-box p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/static/About.html">About Us</a>
        <a href="/static/Contact.html">Contact Us</a>
    </nav>

    <div class="container-box">

        <div class="card">

            <h1>Posted Review</h1>

            <div class="success">
                Review posted successfully!
            </div>

            <p><strong>Dealer ID:</strong> 15</p>
            <p><strong>Dealer Name:</strong> Tempsoft Car Dealership</p>

            <div class="review-box">

                <h2>Review Details</h2>

                <p><strong>Reviewer:</strong> Mayuri</p>

                <p>
                    <strong>Review:</strong>
                    Fantastic services
                </p>

                <p><strong>Purchase:</strong> Yes</p>

                <p><strong>Purchase Date:</strong> 07/11/2020</p>

                <p><strong>Car Make:</strong> Audi</p>

                <p><strong>Car Model:</strong> A6</p>

                <p><strong>Car Year:</strong> 2010</p>

            </div>

        </div>

    </div>

</body>
</html>
