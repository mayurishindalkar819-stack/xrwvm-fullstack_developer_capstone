<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/bootstrap.min.css">

    <title>Post Review - Best Cars Dealership</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #10c4c9;
            padding: 18px 25px;
        }

        .navbar a {
            color: black;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        .review-container {
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .review-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        .post-btn {
            background: #10c4c9;
            color: black;
            border: none;
            padding: 11px 22px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .dealer-info {
            background: #eefafa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/static/About.html">About Us</a>
        <a href="/static/Contact.html">Contact Us</a>
    </nav>

    <div class="review-container">

        <div class="review-card">

            <h1>Post Review</h1>

            <div class="dealer-info">
                <p><strong>Dealer ID:</strong> 15</p>
                <p><strong>Dealer Name:</strong> Tempsoft Car Dealership</p>
                <p><strong>City:</strong> San Antonio</p>
                <p><strong>State:</strong> Texas</p>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" value="mayuri">
            </div>

            <div class="form-group">
                <label for="review">Review</label>
                <textarea id="review">Fantastic services</textarea>
            </div>

            <div class="form-group">
                <label for="purchase">Purchase</label>
                <select id="purchase">
                    <option selected>Yes</option>
                    <option>No</option>
                </select>
            </div>

            <div class="form-group">
                <label for="purchase_date">Purchase Date</label>
                <input type="text" id="purchase_date" value="07/11/2020">
            </div>

            <div class="form-group">
                <label for="car_make">Car Make</label>
                <input type="text" id="car_make" value="Audi">
            </div>

            <div class="form-group">
                <label for="car_model">Car Model</label>
                <input type="text" id="car_model" value="A6">
            </div>

            <div class="form-group">
                <label for="car_year">Car Year</label>
                <input type="text" id="car_year" value="2010">
            </div>

            <button type="button" class="post-btn">
                Post Review
            </button>

        </div>

    </div>

</body>
</html>
